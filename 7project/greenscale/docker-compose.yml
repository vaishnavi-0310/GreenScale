services:
  db:
    image: postgres:16
    container_name: greenscale-db
    environment:
      POSTGRES_USER: greenscale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: greenscale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenscale"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    container_name: greenscale-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  app:
    build: .
    container_name: greenscale-app
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      USE_VERTEX_AI: ${USE_VERTEX_AI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: