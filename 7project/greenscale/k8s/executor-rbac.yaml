apiVersion: v1
kind: ServiceAccount
metadata:
  name: greenscale-executor
  namespace: greenscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: greenscale-executor
  namespace: greenscale
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greenscale-executor
  namespace: greenscale
subjects:
  - kind: ServiceAccount
    name: greenscale-executor
    namespace: greenscale
roleRef:
  kind: Role
  name: greenscale-executor
  apiGroup: rbac.authorization.k8s.io
