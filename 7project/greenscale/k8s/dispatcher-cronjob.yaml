apiVersion: batch/v1
kind: CronJob
metadata:
  name: greenscale-dispatcher
  namespace: greenscale
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: greenscale-executor
          restartPolicy: OnFailure
          containers:
            - name: dispatcher
              image: europe-north1-docker.pkg.dev/greenscale-group24-512813/greenscale/greenscale-api:dispatcher-v3
              imagePullPolicy: Always
              command: ["python", "-m", "execution.dispatcher"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: greenscale-db-secret
                      key: database-url
                - name: GREEN_SCALE_WORKER_IMAGE
                  value: europe-north1-docker.pkg.dev/greenscale-group24-512813/greenscale/greenscale-api:dispatcher-v3
