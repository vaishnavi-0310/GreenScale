apiVersion: apps/v1
kind: Deployment

metadata:
  name: greenscale-api
  namespace: greenscale

spec:
  replicas: 1

  selector:
    matchLabels:
      app: greenscale-api

  template:
    metadata:
      labels:
        app: greenscale-api

    spec:
      serviceAccountName: greenscale-api

      containers:
        - name: greenscale-api
          image: vachi1522/greenscale-api:vertex-v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: greenscale-db-secret
                  key: database-url

            # Gemini through Google Cloud Vertex AI
            - name: USE_VERTEX_AI
              value: "true"

            - name: GOOGLE_CLOUD_PROJECT
              value: "greenscale-group24-512813"

            - name: GOOGLE_CLOUD_LOCATION
              value: "global"