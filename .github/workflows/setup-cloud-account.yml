name: Setup Cloud Account

on:
  push:
    paths:
      - '**.pub'  # Trigger when any .pub file is pushed

jobs:
  dummy-job:
    runs-on: ubuntu-latest
    steps:
      # The workflow must contain at least one job with no dependencies.
      - name: Nothing
        run: echo "This is a dummy job that does nothing."

  provision-account:
    uses: dat515-2026/.github/.github/workflows/provision-student-account.yml@main
    secrets:
      OPENSTACK_PROJECT_ID: ${{ secrets.OPENSTACK_PROJECT_ID }}
      OPENSTACK_USERNAME: ${{ secrets.OPENSTACK_USERNAME }}
      OPENSTACK_PASSWORD: ${{ secrets.OPENSTACK_PASSWORD }}
    with:
      # Pass your UiS email ID "email@uis.no"
      student_email: ""
