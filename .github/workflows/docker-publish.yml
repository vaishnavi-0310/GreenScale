name: Docker Build and Push

on:
  push:
    branches: [ "main" ] # Run this workflow on pushes to the main branch
    paths:
      - '4docker/5-multi-arch/task1/**'
      - '9docker/app/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Determine which folder triggered this run, since the two tasks use different Dockerfiles
      - name: Detect changed app
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker4: '4docker/5-multi-arch/task1/**'
            docker9: '9docker/app/**'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (4docker)
        if: steps.filter.outputs.docker4 == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./4docker/5-multi-arch/task1
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dat515-4docker-app:latest

      - name: Build and push (9docker)
        if: steps.filter.outputs.docker9 == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./9docker/app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dat515-9docker-app:latest