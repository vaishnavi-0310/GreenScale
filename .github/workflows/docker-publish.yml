name: Docker Build and Push

on:
  push:
    branches: [ "main" ] # Run this workflow on pushes to the main branch
    paths:
      - '4docker/app/**' # Change this from 4 to 9, if you are going with 9docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./4docker/app # Change this from 4 to 9, if you are going with 9docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dat515-app:latest