name: GreenScale CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 7project/greenscale
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 7project/greenscale/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests (offline, no database, LLM, GKE or price API)
        run: python -m pytest -q

      - name: Syntax check (compileall)
        run: python -m compileall -q app tests scripts

      - name: Validate Kubernetes manifests (offline)
        run: python scripts/check_manifests.py

  docker-build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t greenscale:ci 7project/greenscale
