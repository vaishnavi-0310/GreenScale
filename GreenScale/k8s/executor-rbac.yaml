# ServiceAccount is an identity for a pod. Role is a list of permitted actions. RoleBinding attaches a Role to one or more ServiceAccounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: greenscale-executor
  namespace: greenscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: greenscale-executor
  namespace: greenscale
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greenscale-executor
  namespace: greenscale
subjects:
  - kind: ServiceAccount
    name: greenscale-executor
    namespace: greenscale
  - kind: ServiceAccount
    name: greenscale-api
    namespace: greenscale
roleRef:
  kind: Role
  name: greenscale-executor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: greenscale-api-results-reader
  namespace: greenscale
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greenscale-api-results-reader
  namespace: greenscale
subjects:
  - kind: ServiceAccount
    name: greenscale-api
    namespace: greenscale
roleRef:
  kind: Role
  name: greenscale-api-results-reader
  apiGroup: rbac.authorization.k8s.io
