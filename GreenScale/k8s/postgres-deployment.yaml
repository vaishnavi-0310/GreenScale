apiVersion: apps/v1
kind: Deployment

metadata:
  name: greenscale-postgres
  namespace: greenscale

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: greenscale-postgres

  template:
    metadata:
      labels:
        app: greenscale-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6

          envFrom:
            - secretRef:
                name: greenscale-postgres-secret
          
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: greenscale-postgres-pvc